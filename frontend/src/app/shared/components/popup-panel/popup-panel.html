<div class="popup-anchor" [class.popup-open]="isOpen()">
  <ng-content select="[popup-trigger]"></ng-content>
</div>
<ng-template #panel>
  <div
    class="popup-content"
    [class.leaving]="leaving()"
    role="dialog"
    [attr.aria-label]="label()"
    (click)="onContentClick($event)"
  >
    <ng-content select="[popup-content]"></ng-content>
  </div>
</ng-template>
