<app-popup-panel [popupId]="popupId" group="select" placement="below" [closeOnContentClick]="true" [label]="label()">
  <button popup-trigger class="select-trigger" type="button" [attr.aria-label]="label()" aria-haspopup="listbox">
    <span class="select-value">{{ selectedLabel() }}</span>
    <svg lucideChevronDown [size]="16" class="select-chevron"></svg>
  </button>
  <div popup-content class="select-list" role="listbox">
    @for (option of options(); track option.value) {
      <button type="button" role="option" [class.active]="option.value === value()" [attr.aria-selected]="option.value === value()" (click)="value.set(option.value)">
        <span>{{ option.label }}</span>
        @if (option.value === value()) { <svg lucideCheck [size]="15"></svg> }
      </button>
    }
  </div>
</app-popup-panel>
