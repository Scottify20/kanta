<app-popup-panel [popupId]="popupId()" [group]="group()" placement="below" [closeOnContentClick]="true" label="Options">
  <button popup-trigger class="entry-menu-trigger" type="button" aria-label="More options" (click)="menu.reset()">
    <svg lucideMoreHorizontal [size]="18"></svg>
  </button>
  <app-context-menu #menu="contextMenu" popup-content minWidth="11rem" ariaLabel="Entry options">
    @if (menu.isView('playlists')) {
      <app-playlist-picker
        [playlists]="playlists()"
        (pick)="pickPlaylist($event, menu)"
        (create)="createPlaylist($event, menu)"
      />
    } @else {
      <button type="button" role="menuitem" (click)="triggerAction('play', $event)">Play</button>
      @if (kind() !== 'song') {
        <button type="button" role="menuitem" (click)="triggerAction('shuffle', $event)">Shuffle</button>
      }
      <button type="button" role="menuitem" (click)="triggerAction('play-next', $event)">Play next</button>
      <button type="button" role="menuitem" (click)="triggerAction('queue', $event)">Add to queue</button>

      @if (kind() !== 'playlist') {
        <button type="button" role="menuitem" class="submenu" data-keep-open (click)="menu.openSubmenu('playlists', 'Add to playlist')">
          <span>Add to playlist</span><svg lucideChevronRight [size]="16"></svg>
        </button>
      }

      @switch (kind()) {
        @case ('song') {
          <hr />
          <button type="button" role="menuitem" (click)="triggerAction('go-album', $event)">Go to album</button>
          <button type="button" role="menuitem" (click)="triggerAction('go-artist', $event)">Go to artist</button>
          <button type="button" role="menuitem" (click)="triggerAction('edit', $event)">Edit metadata</button>
          @if (inPlaylist()) {
            <button type="button" role="menuitem" (click)="triggerAction('remove-from-playlist', $event)">Remove from playlist</button>
          }
          <button type="button" role="menuitem" class="danger" (click)="triggerAction('delete', $event)">Delete song</button>
        }
        @case ('album') {
          <hr />
          <button type="button" role="menuitem" (click)="triggerAction('open', $event)">View album</button>
          <button type="button" role="menuitem" (click)="triggerAction('go-artist', $event)">Go to artist</button>
          <button type="button" role="menuitem" class="danger" (click)="triggerAction('delete', $event)">Delete album</button>
        }
        @case ('artist') {
          <hr />
          <button type="button" role="menuitem" (click)="triggerAction('open', $event)">View artist</button>
          <button type="button" role="menuitem" class="danger" (click)="triggerAction('delete', $event)">Delete artist’s songs</button>
        }
        @case ('genre') {
          <hr />
          <button type="button" role="menuitem" (click)="triggerAction('open', $event)">View genre</button>
        }
        @case ('playlist') {
          <hr />
          <button type="button" role="menuitem" (click)="triggerAction('open', $event)">View playlist</button>
          @if (canRename()) {
            <button type="button" role="menuitem" (click)="triggerAction('rename-playlist', $event)">Rename</button>
          }
          <button type="button" role="menuitem" class="danger" (click)="triggerAction('delete-playlist', $event)">Delete playlist</button>
        }
      }
    }
  </app-context-menu>
</app-popup-panel>
