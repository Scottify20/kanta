<div class="device-grid">
  <label class="device-field">
    <span>Audio output</span>
    <select [ngModel]="outputId()" (ngModelChange)="changeOutput($event)">
      <option value="">System default</option>
      @for (device of outputs(); track $index) { <option [value]="device.id">{{ device.label }}</option> }
    </select>
  </label>
  <label class="device-field">
    <span>Microphone input</span>
    <select [ngModel]="inputId()" (ngModelChange)="changeInput($event)">
      <option value="">System default</option>
      @for (device of inputs(); track $index) { <option [value]="device.id">{{ device.label }}</option> }
    </select>
  </label>
</div>
<p class="hint">Device names may appear after the browser grants audio-device access.</p>
