<div class="cover" [class.round]="entry().kind === 'artist'" [class.mosaic]="!single()">
  @if (single() && entry().covers[0]) {
    <img [src]="entry().covers[0]" [alt]="entry().title + ' cover'" />
  } @else if (!single()) {
    @for (url of covers(); track $index) {
      <span [style.background-image]="url ? 'url(' + url + ')' : null"></span>
    }
  }
</div>
<div class="info">
  <h2>{{ entry().title }}</h2>
  <p>{{ summary() }}</p>
  @if (artistInfo()?.bio; as bio) {
    <p class="bio" [class.expanded]="bioExpanded()">{{ bio }}</p>
    <div class="bio-meta">
      <button type="button" class="link" (click)="bioExpanded.set(!bioExpanded())">{{ bioExpanded() ? 'Show less' : 'Read more' }}</button>
      @if (artistInfo()?.sources?.length) { <small>via {{ artistInfo()!.sources.join(', ') }}</small> }
    </div>
  }
  <div class="actions">
    <button type="button" class="primary" (click)="playAll.emit()">
      <svg lucidePlay [size]="16"></svg> Play All
    </button>
    <button type="button" (click)="shuffle.emit()">
      <svg lucideShuffle [size]="16"></svg> Shuffle and Play
    </button>
    <button type="button" (click)="addToQueue.emit()">
      <svg lucideListPlus [size]="16"></svg> Add to Queue
    </button>
  </div>
</div>
