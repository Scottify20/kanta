<div
  class="item"
  role="option"
  tabindex="0"
  draggable="true"
  [attr.aria-selected]="selected()"
  (click)="activate.emit($event)"
  (keydown.enter)="activate.emit($any($event))"
  (contextmenu)="menu.openAt($event)"
  (dragstart)="dragStarted.emit($event)"
  (dragend)="dragEnded.emit()"
>
  <div class="art" [class.round]="round()">
    @if (mosaic()) {
      @for (url of mosaicCovers(); track $index) {
        <span class="tile" [style.background-image]="url ? 'url(' + url + ')' : null"></span>
      }
    } @else if (entry().covers[0]) {
      <img [src]="entry().covers[0]" [alt]="entry().title + ' cover'" loading="lazy" draggable="false" />
    } @else {
      <span class="placeholder"></span>
    }
    @if (progress() !== null) {
      <span class="progress" [style.--progress]="progress() + '%'" role="progressbar" [attr.aria-valuenow]="progress()" aria-label="Processing"></span>
    }
    <span class="check" aria-hidden="true"></span>
  </div>
  <div class="text">
    <div class="title-row">
      <strong>{{ entry().title }}</strong>
      @if (lyricsLevel(); as level) {
        <span class="lyrics-chip" [class]="'level-' + level">{{ level }}</span>
      }
      @if (entry().kind === 'song' && entry().songs[0]?.is_duet) {
        <span class="lyrics-chip duet">Duet</span>
      }
    </div>
    <small>{{ entry().subtitle }}</small>
  </div>
  <app-entry-menu #menu
    class="menu"
    [kind]="entry().kind"
    [popupId]="'lib:' + entry().key"
    group="library"
    [playlists]="playlists()"
    [inPlaylist]="inPlaylist()"
    [revealOnHover]="true"
    (action)="action.emit($event)"
  />
</div>
