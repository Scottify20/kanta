<section class="queue-panel">
  <input #fileInput class="visually-hidden" type="file" multiple accept="audio/*,.flac,.mp3,.wav,.m4a,.ogg,.opus,.aac,.mp4,.webm,.ttml,.lrc" tabindex="-1" aria-hidden="true" (change)="onFilesChosen(fileInput)" />
  <input #folderInput class="visually-hidden" type="file" webkitdirectory multiple tabindex="-1" aria-hidden="true" (change)="onFilesChosen(folderInput, true)" />

  <app-karaoke-queue-section
    [items]="karaokeItems()"
    [activeTaskId]="activeTaskId()"
    [playbackActive]="playbackActive()"
    [collapsed]="karaokeCollapsed()"
    [totalLabel]="karaokeTotalLabel()"
    (toggleCollapse)="karaokeCollapsed.set(!karaokeCollapsed())"
    (clear)="clearQueue(1)"
    (trackSelected)="trackSelected.emit($event)"
    (pause)="pause($event)"
    (resume)="resume($event)"
    (remove)="remove($event, 'karaoke')"
    (reordered)="reorderKaraoke($event)"
  />

  <app-processing-queue-section
    [items]="processingView()"
    [paused]="processingPaused()"
    [collapsed]="processingCollapsed()"
    (toggleCollapse)="processingCollapsed.set(!processingCollapsed())"
    (togglePause)="toggleProcessingPause()"
    (clear)="clearQueue(2)"
    (browseFiles)="browseFiles('processing')"
    (browseFolder)="browseFolder()"
    (pause)="pause($event)"
    (resume)="resume($event)"
    (remove)="remove($event, 'processing')"
    (reordered)="reorderProcessing($event)"
    (droppedFiles)="addFiles($event, 'processing')"
  />
</section>
