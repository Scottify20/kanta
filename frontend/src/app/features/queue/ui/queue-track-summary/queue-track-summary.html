<span class="cover-art-wrap">
  @if (item().cover_url) {
    <img
      class="cover-image"
      [src]="item().cover_url"
      [alt]="'Album cover for ' + item().raw_album"
    />
  } @else {
    <span class="cover-placeholder" aria-hidden="true"></span>
  }
  @if (item().status === 'processing' || item().status === 'paused') {
    <span
      class="cover-progress-overlay"
      [style.--progress]="item().progress + '%'"
      role="progressbar"
      [attr.aria-label]="'Processing ' + item().progress + ' percent'"
    ></span>
  }
</span>

<div class="track-info">
  <div class="track-title-row">
    <strong>{{ item().raw_title }}</strong>
    <span
      class="lyrics-chip"
      [class.level-word]="lyricsLevel() === 'word'"
      [class.level-line]="lyricsLevel() === 'line'"
      [class.level-none]="lyricsLevel() === 'none'"
    >
      {{ lyricsLevelLabel() }}
    </span>
    @if (isDuet()) {
      <span class="lyrics-chip duet">Duet</span>
    }
  </div>
  <small>{{ subtitle() }}</small>
</div>

@if (variant() === 'karaoke') {
  @defer (on idle) {
    <app-queue-party-controls
      [item]="item()"
      [isDuet]="isDuet()"
      [showDuetPrompt]="duetPrompt()"
      (duetPromptHandled)="duetPromptHandled.emit()"
    />
  }
}
