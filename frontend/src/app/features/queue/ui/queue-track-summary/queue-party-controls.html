<div class="queue-party-controls" [style.--singer-color]="primarySinger()?.accentColor ?? 'transparent'">
  <div class="assignment-content">
    <button
      type="button"
      class="singer-buttons"
      [class.has-conflict]="hasVocalConflict()"
      [attr.aria-label]="
        hasVocalConflict()
          ? 'Vocal range conflict for ' + item().raw_title + '. Click to resolve.'
          : 'Assign singers for ' + item().raw_title
      "
      [title]="hasVocalConflict() ? 'Key gap conflict — click to resolve' : (primarySinger()?.name ?? 'Assign singer')"
      (click)="openAssignment($event)"
    >
      <span
        class="singer-avatar"
        [style.background]="primarySinger()?.accentColor ?? '#444'"
      >
        {{ singerInitial(primarySinger()) }}
      </span>
      @if (isDuetMode()) {
        <span
          class="singer-avatar secondary"
          [style.background]="secondarySinger()?.accentColor ?? '#444'"
        >
          {{ singerInitial(secondarySinger()) }}
        </span>
      }
      @if (hasVocalConflict()) {
        <span class="conflict-badge" aria-hidden="true">!</span>
      }
    </button>

    <div class="queue-fit-row">
      @if (keyShiftLabel(); as shift) {
        <span class="key-shift">{{ shift }}</span>
      }
      @if (rangeFit(); as fit) {
        <span class="fit-indicator" [class]="'fit-indicator fit-' + fit" [attr.aria-label]="'Vocal range fit: ' + fit"></span>
      } @else {
        <span class="fit-indicator fit-unknown" aria-label="Vocal range not analyzed"></span>
      }
    </div>
  </div>
</div>
