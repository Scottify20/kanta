<app-popup-panel popupId="lyrics-timing" label="Lyrics timing">
  <button popup-trigger class="circle-button" type="button" aria-label="Adjust lyrics timing">
    <svg lucideTimer [size]="18"></svg>
  </button>
  <section popup-content class="lyrics-timing-popover">
    <header>
      <strong>Lyrics timing</strong>
      <output>
        @if (offsetMs() > 0) {
          +{{ offsetMs() / 1000 }}s · Delay
        } @else if (offsetMs() < 0) {
          {{ offsetMs() / 1000 }}s · Advance
        } @else {
          Aligned
        }
      </output>
    </header>
    <div class="lyrics-timing-stepper">
      <button type="button" (click)="adjust.emit(-1)">−1s</button>
      <button type="button" (click)="adjust.emit(-0.1)">−0.1s</button>
      <input
        type="number"
        min="-10"
        max="10"
        step="0.1"
        [value]="offsetMs() / 1000"
        (input)="updateOffset($event)"
        (change)="save.emit()"
        aria-label="Lyrics timing adjustment in seconds"
      />
      <button type="button" (click)="adjust.emit(0.1)">+0.1s</button>
      <button type="button" (click)="adjust.emit(1)">+1s</button>
    </div>
    <button
      class="lyrics-timing-reset"
      type="button"
      [disabled]="offsetMs() === 0"
      (click)="reset.emit()"
    >
      <svg lucideRotateCcw [size]="14"></svg>
      Reset timing
    </button>
  </section>
</app-popup-panel>
