@if (visible()) {
  <section class="mini-lyrics" [class.minimized]="minimized()" aria-label="Mini lyrics"
    [style.left.px]="bounds().x" [style.top.px]="bounds().y"
    [style.width.px]="bounds().width" [style.height.px]="minimized() ? 48 : bounds().height">
    <header class="mini-header">
      <div class="drag-handle" role="button" tabindex="0"
        aria-label="Move mini lyrics. Use arrow keys to move."
        (pointerdown)="startGesture($event, 'move')" (pointermove)="moveGesture($event)"
        (pointerup)="finishGesture($event)" (pointercancel)="cancelGesture($event)"
        (keydown)="onKeyboard($event, 'move')">
        <span class="grip" aria-hidden="true">⠿</span>
        <span class="title">{{ title() }}</span>
      </div>
      <div class="header-actions">
        @if (!minimized()) {
        <app-popup-panel popupId="mini-lyrics-size" group="mini-lyrics" label="Mini lyrics size">
          <button popup-trigger class="header-button" type="button" aria-label="Adjust mini lyrics size" appTooltip="Lyrics size">
            <svg lucideALargeSmall [size]="18"></svg>
          </button>
          <section popup-content class="mini-size-popover">
            <header>
              <strong>Lyrics size</strong>
              <output>{{ size.miniScale() * 100 | number: '1.0-0' }}%</output>
            </header>
            <input type="range" [min]="size.min" [max]="size.max" [step]="size.step"
              [value]="size.miniScale()" (input)="updateSize($event)" aria-label="Mini lyrics size slider" />
            <button type="button" [disabled]="size.miniScale() === 1" (click)="size.setMini(1)">
              <svg lucideRotateCcw [size]="14"></svg> Reset size
            </button>
          </section>
        </app-popup-panel>
        <a class="header-button" routerLink="/" aria-label="Open now playing" appTooltip="Open player">
          <svg lucideExternalLink [size]="18"></svg>
        </a>
        }
        <button class="header-button" type="button" [attr.aria-label]="minimized() ? 'Expand mini lyrics' : 'Minimize mini lyrics'"
          [appTooltip]="minimized() ? 'Expand lyrics' : 'Minimize lyrics'" [attr.aria-expanded]="!minimized()" (click)="toggleMinimized()">
          @if (minimized()) { <svg lucideChevronUp [size]="18"></svg> }
          @else { <svg lucideChevronDown [size]="18"></svg> }
        </button>
      </div>
    </header>
    @if (!minimized()) {
    <div class="mini-content">
      @if (lyrics.lyrics()?.length) {
        <app-lyrics-stage [compact]="true" [coverUrl]="cover()" [songKey]="key()"
          [lyrics]="lyrics.lyrics()" [currentTime]="time()" [playing]="audio.isPlaying()" />
      } @else {
        <p>{{ lyrics.isLoading() ? 'Loading lyrics…' : 'No synchronized lyrics available.' }}</p>
      }
    </div>
    <button class="resize-handle" type="button" aria-label="Resize mini lyrics. Use arrow keys to resize."
      (pointerdown)="startGesture($event, 'resize')" (pointermove)="moveGesture($event)"
      (pointerup)="finishGesture($event)" (pointercancel)="cancelGesture($event)"
      (keydown)="onKeyboard($event, 'resize')">
      <span aria-hidden="true"></span>
    </button>
    }
  </section>
}
