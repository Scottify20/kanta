<div
  class="cover-and-lyrics-container"
  [class.fullscreen]="fullscreen()"
  [class.collapsed]="collapsed()"
>
  <section>
    @if (coverUrl(); as cover) {
      <img class="album-art" [src]="cover" [alt]="coverAlt()" />
    } @else {
      <div class="album-art album-art-placeholder" aria-label="No album cover"></div>
    }
  </section>

  <section class="lyrics-stage" aria-label="Lyrics">
    <!-- The web component keeps rendered lines when lyrics become empty, so recreate it per lyrics set. -->
    @for (key of [lyricsKey()]; track key) {
      <braccato-lyrics
        [lyrics]="lyrics() ?? []"
        [currentTime]="currentTime()"
        [playing]="playing()"
        (click)="lyricClick.emit($event)"
      >
      </braccato-lyrics>
    }
  </section>
</div>
